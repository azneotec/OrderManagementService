# Everything OrderManagementService needs to run locally: MySQL, and Kafka (+ topics, + UI).
# Start with `make infra-up` (or `docker compose up -d --wait`), stop with `make infra-down`.
# The service itself runs on the host (`make run` or `./mvnw spring-boot:run`) or, with `make docker-up`, as the `app`
# container built from the Dockerfile. Eureka is optional: see .env.example.
#
# This stack binds the same host ports as the monorepo's root docker-compose.yml and
# NotificationService/docker-compose.yml (3307, 9092, 8090), so run only one of them at a time.
name: order-management-service

services:
  # Host port defaults to 3307 because a MySQL installed on the host usually owns 3306.
  # Override with MYSQL_PORT and point DB_URL at the same port.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: order_management_service # Flyway creates the tables on first start
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Single-node KRaft broker. Two client listeners: localhost:9092 for the service on the host (the default
  # spring.kafka.bootstrap-servers) and kafka:19092 for containers on the compose network (the `app` service).
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
      - "8090:8090" # Kafka UI (kafka-ui shares this container's network, see below)
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # One-shot job: creates the topics the service talks on, then exits. payment-requested and payment-result have
  # 3 partitions so two instances of the service share the work; order-notification feeds NotificationService.
  # Shares the broker's network namespace because the broker advertises localhost:9092, which only resolves
  # correctly from inside that namespace.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: "service:kafka"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic payment-requested --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic payment-result --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic order-notification --partitions 1 --replication-factor 1

  # Web UI: http://localhost:8090 (same network-namespace trick as kafka-init).
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: "service:kafka"
    environment:
      SERVER_PORT: 8090
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092

  # The service itself, built from the Dockerfile. Only started with the `app` profile (`make docker-up`), so a
  # plain `docker compose up` still gives just the infrastructure for running the app on the host.
  # Eureka is off by default: a registry on the host is reached at host.docker.internal, see the variables below.
  app:
    profiles: ["app"]
    build: .
    image: order-management-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_management_service?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-false}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
    ports:
      - "${SERVER_PORT:-8004}:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:
  kafka-data:
