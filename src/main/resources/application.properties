spring.application.name=order-management-service

# 8004 for a single instance; start a second instance with SERVER_PORT=9004 so both register with Eureka
# under the same name (order-management-service) on different ports.
server.port=${SERVER_PORT:8004}

# Local overrides: an optional .env in the working directory (see .env.example) feeds the ${...} placeholders
# below, so `./mvnw spring-boot:run` and `make run` read the same file. Real environment variables win over it.
# Values must be unquoted: the file is read as .properties here, but sourced by the shell in the Makefile.
spring.config.import=optional:file:.env[.properties]

# Datasource. Defaults are for local dev (the root compose MySQL on 3307); override via env vars elsewhere.
# createDatabaseIfNotExist covers a MySQL volume that was created before this service existed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/order_management_service?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Entities are mapped to DTOs inside the service's transaction, never in the controller.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:migration

# Kafka (localhost:9092 by default, the root compose broker). Producers are best-effort and must not hold a
# request for the default 60s metadata wait. New consumer groups start from the oldest message so a payment
# result published while this service was down is still processed.
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=order-management-service

# Topics. payment-requested goes to PaymentService, which answers on payment-result; order-notification
# carries the customer emails that NotificationService sends.
orders.topics.payment-requested=payment-requested
orders.topics.payment-result=payment-result
orders.topics.order-notification=order-notification
# Sender address on every email message; NotificationService uses it as the SMTP login.
orders.notification.sender=azneotech@gmail.com

# Downstream calls go through Eureka (user-auth-service validates tokens, product-catalog-service prices products).
orders.clients.connect-timeout=2s
orders.clients.read-timeout=5s

management.endpoints.web.exposure.include=health

# A standalone run has no Eureka server: EUREKA_CLIENT_ENABLED=false (in .env) switches the client off.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
